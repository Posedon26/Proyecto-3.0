<!-- jinja: ignore -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Estación Espacial</title>
    <style>
        :root {
            --space-dark: #020010;
            --panel-bg: rgba(12, 18, 45, 0.92);
            --panel-border: rgba(100, 140, 255, 0.2);
            --accent: #7c8aff;
            --text-primary: #e0e0f0;
            --text-secondary: #9090b0;
            --danger: #f87171;
            --success: #4ade80;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--space-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .space-bg {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 0; pointer-events: none;
        }
        .star {
            position: absolute; background: white; border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            animation-delay: var(--delay);
        }
        @keyframes twinkle {
            0%, 100% { opacity: var(--min-opacity); transform: scale(1); }
            50% { opacity: 1; transform: scale(2); }
        }
        .nebula {
            position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.06;
        }
        .nebula-1 {
            width: 400px; height: 300px; background: #6b3fa0;
            top: -5%; right: -8%; animation: drift 15s infinite ease-in-out;
        }
        .nebula-2 {
            width: 350px; height: 250px; background: #1a5fb4;
            bottom: -8%; left: -8%; animation: drift 18s infinite ease-in-out reverse;
        }
        @keyframes drift {
            0%, 100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(30px,-20px) scale(1.06); }
        }
        .container {
            position: relative; z-index: 1;
            background: var(--panel-bg);
            padding: 40px 35px;
            border-radius: 20px;
            width: 420px;
            max-width: 90%;
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: entry 0.6s ease-out;
        }
        @keyframes entry {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .header {
            text-align: center; margin-bottom: 25px;
        }
        .header-icon { font-size: 3rem; animation: float 3s infinite ease-in-out; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .header h1 {
            font-size: 1.6rem;
            background: linear-gradient(180deg, #f0f0ff 0%, #c0d0ff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: 8px;
        }
        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 0.85rem;
            text-align: center;
        }
        .alert-error {
            background: rgba(248,113,113,0.1);
            border: 1px solid rgba(248,113,113,0.3);
            color: #fca5a5;
        }
        .alert-success {
            background: rgba(74,222,128,0.1);
            border: 1px solid rgba(74,222,128,0.3);
            color: #6ee7a8;
        }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(15, 20, 50, 0.8);
            border: 1px solid rgba(100, 140, 255, 0.2);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: rgba(120, 160, 255, 0.5);
            box-shadow: 0 0 20px rgba(120,140,255,0.1);
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6b5ce7 0%, #5a4bd1 100%);
            border: 1px solid rgba(120, 140, 255, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn:hover {
            background: linear-gradient(135deg, #7c6af7 0%, #6a58e0 100%);
            box-shadow: 0 10px 30px rgba(100,80,220,0.35);
            transform: translateY(-2px);
        }
        .info {
            text-align: center;
            margin-top: 15px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            padding: 10px;
            background: rgba(120,140,255,0.05);
            border-radius: 8px;
        }
        .info strong { color: #b0c0ff; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 12px;
            color: var(--text-secondary);
            font-size: 0.82rem;
            text-decoration: none;
        }
        .back-link:hover { color: #b0c0ff; }
    </style>
</head>
<body>

    <!-- Fondo de estrellas y nebulosas -->
    <div class="space-bg" id="spaceBg">
        <div class="nebula nebula-1"></div>
        <div class="nebula nebula-2"></div>
    </div>

    <!-- Panel de login -->
    <div class="container">
        
        <div class="header">
            <div class="header-icon">🔐</div>
            <h1>Acceso a la Estación</h1>
        </div>

        <!-- Mensajes flash (solo muestra el último, sin duplicados) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% set last_msg = messages|last %}
                <div class="alert {{ 'alert-success' if last_msg[0] == 'success' else 'alert-error' }}">
                    {{ last_msg[1] }}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Formulario -->
        <form method="POST">
            <div class="form-group">
                <label>👨‍🚀 Usuario</label>
                <input type="text" name="usuario" placeholder="Ingrese su usuario" required autofocus>
            </div>
            <div class="form-group">
                <label>🔑 Contraseña</label>
                <input type="password" name="password" placeholder="Ingrese su contraseña" required>
            </div>
            <button type="submit" class="btn">🚀 Iniciar Sesión</button>
        </form>

        <!-- Info de credenciales -->
        <div class="info">
            <p>Credenciales por defecto:</p>
            <p>👤 <strong>admin</strong> | 🔑 <strong>admin123</strong></p>
        </div>

        <!-- Volver -->
        <a href="/" class="back-link">◄ Volver a la Estación</a>
    </div>

    <!-- Estrellas animadas -->
    <script>
        var bg = document.getElementById('spaceBg');
        for (var i = 0; i < 70; i++) {
            var s = document.createElement('div');
            s.classList.add('star');
            s.style.cssText = 'width:'+(Math.random()*2+0.5)+'px;height:'+(Math.random()*2+0.5)+'px;left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;--duration:'+(Math.random()*3+2)+'s;--delay:'+(Math.random()*4)+'s;--min-opacity:'+(Math.random()*0.3+0.06)+';';
            bg.appendChild(s);
        }
    </script>

</body>
</html>
