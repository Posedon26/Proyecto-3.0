<!-- jinja: ignore -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Análisis | Estación Espacial</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --space-dark: #020010;
            --panel-bg: rgba(12, 18, 45, 0.92);
            --panel-border: rgba(100, 140, 255, 0.2);
            --accent: #7c8aff;
            --text-primary: #e0e0f0;
            --text-secondary: #9090b0;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #f87171;
            --comet-cyan: #00e5ff;
            --card-bg: rgba(18, 24, 55, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--space-dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 25px;
            position: relative;
            overflow-x: hidden;
        }

        .space-bg {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 0; pointer-events: none;
        }

        .star {
            position: absolute; background: white; border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            animation-delay: var(--delay);
        }

        @keyframes twinkle {
            0%, 100% { opacity: var(--min-opacity); transform: scale(1); }
            50% { opacity: 1; transform: scale(2.2); }
        }

        .nebula {
            position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.06;
        }

        .nebula-1 {
            width: 450px; height: 320px; background: #6b3fa0;
            top: -5%; right: -8%; animation: nebulaDrift 15s infinite ease-in-out;
        }

        .nebula-2 {
            width: 400px; height: 280px; background: #1a5fb4;
            bottom: -8%; left: -8%; animation: nebulaDrift 18s infinite ease-in-out reverse;
        }

        @keyframes nebulaDrift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.06); }
            66% { transform: translate(-20px, 15px) scale(0.94); }
        }

        .container {
            position: relative; z-index: 1;
            max-width: 1200px; margin: 0 auto;
        }

        .header {
            display: flex; align-items: center; gap: 14px; margin-bottom: 25px;
        }

        .header-icon { font-size: 2.5rem; animation: float 3s infinite ease-in-out; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .header-text h1 {
            font-size: 1.8rem; font-weight: 700;
            background: linear-gradient(180deg, #f0f0ff 0%, #c0d0ff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-text .subtitle {
            color: var(--text-secondary); font-size: 0.8rem;
            letter-spacing: 1.5px; text-transform: uppercase;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px; margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px; padding: 22px 20px;
            text-align: center; transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .stat-card:hover {
            border-color: rgba(120, 160, 255, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(80, 100, 200, 0.2);
        }

        .stat-icon { font-size: 2rem; margin-bottom: 8px; }
        .stat-value { font-size: 2.2rem; font-weight: 800; color: #d0d8ff; }
        .stat-label { color: var(--text-secondary); font-size: 0.8rem; margin-top: 4px; }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px; margin-bottom: 25px;
        }

        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
        }

        .chart-card {
            background: var(--card-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px; padding: 20px;
            backdrop-filter: blur(10px);
        }

        .chart-title {
            color: var(--text-secondary); font-size: 0.8rem;
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 15px; text-align: center;
        }

        canvas { max-height: 300px; }

        .table-card {
            background: var(--card-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px; padding: 20px;
            margin-bottom: 25px; overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; }

        th {
            text-align: left; padding: 12px 14px;
            color: var(--accent); font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 1px solid rgba(120, 140, 255, 0.2);
        }

        td {
            padding: 10px 14px; border-bottom: 1px solid rgba(100, 140, 255, 0.06);
            font-size: 0.88rem; color: #c8c8e0;
        }

        tr:hover td { background: rgba(40, 50, 90, 0.5); }

        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px;
            background: rgba(120, 140, 255, 0.08);
            border: 1px solid rgba(120, 140, 255, 0.2);
            border-radius: 10px; color: var(--text-secondary);
            text-decoration: none; font-size: 0.85rem;
            transition: all 0.3s ease; margin-top: 15px;
        }

        .btn:hover {
            background: rgba(120, 140, 255, 0.15);
            border-color: rgba(120, 140, 255, 0.4);
            color: #d0d8ff;
            box-shadow: 0 5px 20px rgba(80, 100, 200, 0.2);
        }

        .empty-state {
            text-align: center; padding: 60px;
            color: var(--text-secondary);
        }

        .empty-icon { font-size: 4rem; display: block; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="space-bg" id="spaceBg">
        <div class="nebula nebula-1"></div>
        <div class="nebula nebula-2"></div>
    </div>

    <div class="container">
        
        <div class="header">
            <span class="header-icon">📊</span>
            <div class="header-text">
                <h1>Centro de Análisis de Misión</h1>
                <p class="subtitle">📡 Estadísticas y métricas de evaluación</p>
            </div>
        </div>

        <div id="dashboardContent"></div>

        <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 15px;">
    <a href="/descargar-pdf" class="btn" style="background: rgba(74, 222, 128, 0.1); border-color: rgba(74, 222, 128, 0.3); color: #4ade80;">
        📄 Descargar Reporte PDF
    </a>
    <a href="/" class="btn">◄ Regresar a la Estación Principal</a>
</div>
    </div>

    <script>
        // DATOS DESDE FLASK
        var TOTAL = parseInt("{{ total }}") || 0;
        var PROMEDIO = parseFloat("{{ promedio }}") || 0;
        var APROBADOS = parseInt("{{ aprobados }}") || 0;
        var REPROBADOS = parseInt("{{ reprobados }}") || 0;
        var PORCENTAJE = parseFloat("{{ porcentaje_aprobados }}") || 0;
        var STATS_PREGUNTAS = JSON.parse('{{ stats_por_pregunta | tojson | safe }}');
        var DISTRIBUCION = JSON.parse('{{ distribucion | tojson | safe }}');
        var HISTORIAL = JSON.parse('{{ historial_notas | tojson | safe }}');
        var ULTIMAS = JSON.parse('{{ ultimas | tojson | safe }}');

        // Estrellas de fondo
        var spaceBg = document.getElementById('spaceBg');
        for (var i = 0; i < 80; i++) {
            var star = document.createElement('div');
            star.classList.add('star');
            star.style.cssText = 
                'width:' + (Math.random()*2+0.5) + 'px;' +
                'height:' + (Math.random()*2+0.5) + 'px;' +
                'left:' + (Math.random()*100) + '%;' +
                'top:' + (Math.random()*100) + '%;' +
                '--duration:' + (Math.random()*3+2) + 's;' +
                '--delay:' + (Math.random()*4) + 's;' +
                '--min-opacity:' + (Math.random()*0.3+0.06) + ';';
            spaceBg.appendChild(star);
        }

        // Construir dashboard
        var html = '';

        if (TOTAL > 0) {
            html += '<div class="stats-grid">';
            html += '<div class="stat-card"><div class="stat-icon">🚀</div><div class="stat-value">' + TOTAL + '</div><div class="stat-label">Misiones Totales</div></div>';
            html += '<div class="stat-card"><div class="stat-icon">⭐</div><div class="stat-value">' + PROMEDIO + '</div><div class="stat-label">Promedio General</div></div>';
            html += '<div class="stat-card"><div class="stat-icon">✅</div><div class="stat-value">' + PORCENTAJE + '%</div><div class="stat-label">Tasa de Aprobación</div></div>';
            html += '<div class="stat-card"><div class="stat-icon">📈</div><div class="stat-value">' + APROBADOS + '/' + REPROBADOS + '</div><div class="stat-label">Aprobados / Reprobados</div></div>';
            html += '</div>';

            html += '<div class="charts-grid">';
            html += '<div class="chart-card"><div class="chart-title">📊 Promedio por Misión</div><canvas id="chartPreguntas"></canvas></div>';
            html += '<div class="chart-card"><div class="chart-title">🥧 Distribución de Resultados</div><canvas id="chartDistribucion"></canvas></div>';
            html += '<div class="chart-card" style="grid-column: 1 / -1;"><div class="chart-title">📈 Evolución de Puntuaciones</div><canvas id="chartEvolucion"></canvas></div>';
            html += '</div>';

            html += '<div class="table-card"><div class="chart-title">📋 Rendimiento por Misión</div><table><thead><tr><th>Misión</th><th>Evaluaciones</th><th>Promedio</th><th>Máxima</th><th>Mínima</th></tr></thead><tbody>';
            STATS_PREGUNTAS.forEach(function(s) {
                html += '<tr><td>🎯 Pregunta ' + s.id + '</td><td>' + s.total + '</td><td>' + s.promedio + '</td><td style="color:#4ade80;">' + s.maxima + '</td><td style="color:#f87171;">' + s.minima + '</td></tr>';
            });
            html += '</tbody></table></div>';

            html += '<div class="table-card"><div class="chart-title">🕐 Últimas Misiones</div><table><thead><tr><th>Tripulante</th><th>Misión</th><th>Puntuación</th><th>Fecha</th></tr></thead><tbody>';
            ULTIMAS.forEach(function(u) {
                html += '<tr><td>👨‍🚀 ' + u[0] + '</td><td>Pregunta ' + u[1] + '</td><td>' + u[2] + '</td><td style="color:#9090b0;">' + u[3] + '</td></tr>';
            });
            html += '</tbody></table></div>';

        } else {
            html += '<div class="empty-state"><span class="empty-icon">🛰️</span><p>No hay datos de misión todavía.</p><p style="color:#666;margin-top:8px;">Realiza algunas evaluaciones para ver estadísticas.</p></div>';
        }

        document.getElementById('dashboardContent').innerHTML = html;

        // Gráficos
        setTimeout(function() {
            if (TOTAL > 0) {
                var colors = ['#7c8aff', '#4ade80', '#fbbf24', '#f87171', '#00e5ff', '#c084fc'];

                var ctx1 = document.getElementById('chartPreguntas');
                if (ctx1) {
                    new Chart(ctx1, {
                        type: 'bar',
                        data: {
                            labels: STATS_PREGUNTAS.map(function(s) { return 'Misión ' + s.id; }),
                            datasets: [{
                                label: 'Promedio',
                                data: STATS_PREGUNTAS.map(function(s) { return s.promedio; }),
                                backgroundColor: colors,
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: { beginAtZero: true, max: 10, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#9090b0' } },
                                x: { grid: { display: false }, ticks: { color: '#9090b0' } }
                            },
                            plugins: { legend: { display: false } }
                        }
                    });
                }

                var ctx2 = document.getElementById('chartDistribucion');
                if (ctx2) {
                    new Chart(ctx2, {
                        type: 'doughnut',
                        data: {
                            labels: ['Excelente (9-10)', 'Bueno (7-8)', 'Regular (5-6)', 'Malo (<5)'],
                            datasets: [{
                                data: [DISTRIBUCION.excelente, DISTRIBUCION.bueno, DISTRIBUCION.regular, DISTRIBUCION.malo],
                                backgroundColor: ['#4ade80', '#fbbf24', '#fb923c', '#f87171'],
                                borderColor: 'rgba(0,0,0,0.3)',
                                borderWidth: 3
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: { color: '#9090b0', padding: 15 }
                                }
                            }
                        }
                    });
                }

                var ctx3 = document.getElementById('chartEvolucion');
                if (ctx3) {
                    new Chart(ctx3, {
                        type: 'line',
                        data: {
                            labels: HISTORIAL.map(function(h) { return '#' + h.indice; }),
                            datasets: [{
                                label: 'Puntuación',
                                data: HISTORIAL.map(function(h) { return h.nota; }),
                                borderColor: '#7c8aff',
                                backgroundColor: 'rgba(124, 138, 255, 0.1)',
                                fill: true,
                                tension: 0.4,
                                pointRadius: 3,
                                pointBackgroundColor: '#7c8aff'
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: { min: 0, max: 10, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#9090b0' } },
                                x: { grid: { display: false }, ticks: { color: '#9090b0', maxTicksLimit: 15 } }
                            },
                            plugins: { legend: { labels: { color: '#9090b0' } } }
                        }
                    });
                }
            }
        }, 100);
    </script>

</body>
</html>
